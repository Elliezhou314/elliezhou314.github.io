<!-- 模块注册表 → 预解算数据 → 各功能模块 → 启动。顺序只有两条要求：注册表最先、启动最后。 -->
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    if (window.__SQUID_READY__ || window.__SQUID_BOOTED__) return;
    var m = document.querySelector('main');
    if (!m) return;
    m.innerHTML = '<div style="max-width:640px;margin:40px auto;padding:16px 20px;border:1px solid #f5b642;border-radius:10px;background:#161d23;color:#e6edf3;line-height:1.9">'
      + "<h2 style=\"margin-top:0;color:#f5b642\">没能加载完整</h2><p>可能是第一次打开时网络断了，文件没下全。联网后刷新一次页面；离线缓存装好之后，断网也能打开。</p><p style=\"color:#8b9aa8\">还是不行的话，把浏览器里这个网站的数据清掉再打开（进度会一起清掉，先在别的设备上留好）。</p>" + '</div>';
  }, 0);
});
</script>
